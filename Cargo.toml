[package]
name = "everymcp"
version = "1.8.0"
edition = "2024"
description = "Native multi-purpose MCP server for math and Windows host automation"

[[bin]]
name = "EveryMCP"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.151"
num-bigint = "0.5.1"
num-traits = "0.2.19"
half = "2.7.1"
nalgebra = "0.35.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
walkdir = "2.5.0"
regex = "1.13.1"
sha2 = "0.11.0"
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = "3.4.2"
hickory-resolver = "0.26.3"
tokio = { version = "1.53.1", features = ["rt", "time", "net"] }
native-tls = "0.2.18"
toml = "1.1.6"
serde_yaml_ng = "0.10.0"
roxmltree = "0.21.1"
csv = "1.4.0"
goblin = "0.10.7"
imagesize = "0.15.0"
kamadak-exif = "0.6.1"
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
